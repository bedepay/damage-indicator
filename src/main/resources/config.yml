# Форматирование поддерживает MiniMessage: https://docs.advntr.dev/minimessage/format.html

bossbar:
  enabled: true
  # Время показа после последнего удара. 20 тиков = 1 секунда.
  duration-ticks: 60
  # Компактный формат: имя цели, здоровье и последний урон.
  # Переменные заголовка: <target>, <health>, <max_health>, <damage>.
  title: "<gold><target></gold> <dark_gray>•</dark_gray> <red><health>/<max_health> ❤</red> <dark_gray>•</dark_gray> <damage>"
  damage-text: "<bold><gradient:#ffd166:#ff6b35>-<amount></gradient></bold>"
  critical-damage-text: "<bold><gradient:#fff06a:#ff8a00:#ff1744>✦ -<amount> ✦</gradient></bold>"

indicators:
  damage:
    enabled: true
    text: "<bold><gradient:#ff6b6b:#ff0000>-<amount> ❤</gradient></bold>"
  critical:
    enabled: true
    text: "<bold><gradient:#fff06a:#ff8a00:#ff1744>✦ КРИТ -<amount> ✦</gradient></bold>"
  healing:
    enabled: true
    text: "<bold><gradient:#7dff8a:#20d65a>+<amount> ❤</gradient></bold>"

  # Общая анимация парящих цифр.
  duration-ticks: 20
  vertical-offset: 0.35
  random-horizontal-offset: 0.35
  rise-per-tick: 0.045
  view-range: 1.0

# Число знаков после запятой во всех значениях.
decimal-places: 1
